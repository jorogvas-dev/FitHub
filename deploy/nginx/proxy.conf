# Shared proxy settings keep authentication and routing identical for slow AI requests.
proxy_pass http://fithub_web;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $fithub_forwarded_port;
proxy_cookie_flags session secure httponly samesite=lax;
proxy_connect_timeout 2s;
proxy_send_timeout 30s;
# Retry failed connections/GETs. Do not enable non_idempotent POST replay.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 5s;
add_header X-FitHub-Upstream $upstream_addr always;
